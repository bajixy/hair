<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Our home</title>
<meta name="description" content="The little home we're building together.">
<meta name="theme-color" content="#1a1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our home">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Our home">
<meta property="og:description" content="The little home we're building together.">
<meta property="og:image" content="https://bajinna.xyz/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: the home fills the screen; ivory stationery controls float over it — who's here and letters at the top,
   walk/build switch beneath, joystick and buttons (walk) or the block bar (build) along the bottom. Entry is a letter on velvet. */
:root{
  color-scheme:light;
  --velvet:#1a1016; --velvet2:#2c1824;
  --ivory:#faf6ef; --mount:#fffdf9; --ink:#2b2026; --ink2:#4f4048; --muted:#8f7d85;
  --rose:#a8476b; --blush:#e9c6cf; --wine:#8c2f4a; --sage:#6f8f5e;
  --gold:#b8935c; --gold-d:#9a7642; --gold-l:#ecdcb2;
  --paper:rgba(255,253,249,.94); --edge:rgba(184,147,92,.5);
  --f-serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-sans:"Jost","Avenir Next","Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--velvet)}
body{color:var(--ink);font:400 17px/1.5 var(--f-serif);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.caps{font-family:var(--f-sans);font-weight:400;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-d)}

#app{position:fixed;inset:0;background:#f3ddd6;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.paperish{background:var(--paper);border:1px solid var(--edge);box-shadow:0 6px 18px -6px rgba(60,30,40,.35)}

/* top */
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(var(--sat) + 12px) max(12px,calc(var(--sar) + 12px)) 0 max(12px,calc(var(--sal) + 12px));pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 12px;min-height:40px;max-width:62vw}
.chip i{flex:none;width:9px;height:9px;border-radius:50%;background:#c9bcc1;box-shadow:0 0 0 3px rgba(201,188,193,.25)}
.chip.on i{background:#7fae6a;box-shadow:0 0 0 3px rgba(127,174,106,.25);animation:beat 2.2s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 0 6px rgba(127,174,106,.08)}}
.chip span{font-style:italic;font-size:1.02rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.off span{color:var(--ink2)}
.chip.lost i{background:#d9a441;box-shadow:0 0 0 3px rgba(217,164,65,.25)}
.icon-btn{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--wine)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--wine);color:#fdf3e4;font:500 .7rem/20px var(--f-sans);text-align:center;box-shadow:0 0 0 2px var(--mount)}
.modes{position:absolute;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);display:flex}
.seg button{background:transparent;border:0;padding:8px 16px;min-height:36px;font-family:var(--f-sans);font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-d);transition:background .25s,color .25s}
.seg button+button{border-left:1px solid rgba(184,147,92,.3)}
.seg button.on{background:var(--wine);color:#fdf3e4}

/* walk */
.joy{position:absolute;left:max(20px,calc(var(--sal) + 20px));bottom:calc(var(--sab) + 22px);width:124px;height:124px;border-radius:50%;background:rgba(255,253,249,.28);border:1px solid rgba(236,220,178,.9)}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--mount);border:1px solid var(--gold);box-shadow:0 3px 10px rgba(60,30,40,.28)}
.walk-r{position:absolute;right:max(20px,calc(var(--sar) + 20px));bottom:calc(var(--sab) + 26px);display:flex;flex-direction:column;align-items:center;gap:14px}
.round{width:66px;height:66px;border-radius:50%;border:1px solid rgba(236,220,178,.95);background:rgba(255,253,249,.3);color:#fffdf9;font-family:var(--f-sans);font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;text-shadow:0 1px 3px rgba(40,20,30,.5);display:flex;align-items:center;justify-content:center;padding:0}
.round.heart{width:54px;height:54px;background:var(--paper);border-color:var(--edge);color:var(--rose);text-shadow:none}
.round.heart svg{width:24px;height:24px}
.round.kiss{color:var(--wine)}
.round.kiss.near{background:var(--wine);border-color:var(--wine);color:#fdf3e4;animation:kissPulse 1.6s ease-in-out infinite}
.round.kiss.near svg path:last-child{stroke:var(--wine)}
@keyframes kissPulse{50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(140,47,74,.18)}}
.no-touch .joy,.no-touch .walk-r .jump{display:none}
.no-touch .walk-r{bottom:calc(var(--sab) + 26px)}

/* build */
.build{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 14px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding:0 12px}
.build>*{pointer-events:auto}
.bar{display:flex;gap:4px;padding:5px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:rgba(43,32,38,.55);border:1px solid rgba(236,220,178,.55);-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.slot{flex:none;width:46px;height:46px;border:2px solid rgba(255,253,249,.25);background-size:cover;image-rendering:pixelated;padding:0;transition:transform .2s,border-color .2s;position:relative}
.slot.on{border-color:#f3e3b8;transform:translateY(-3px);box-shadow:0 0 0 1px var(--gold-d),0 6px 12px -4px rgba(0,0,0,.5)}
.slot.letter{background:var(--mount);display:flex;align-items:center;justify-content:center;color:var(--wine)}
.slot.letter svg{width:24px;height:24px}
.build-row{display:flex;gap:8px;align-items:center}
.label{font-style:italic;font-size:1.05rem;color:#fffdf9;text-shadow:0 1px 6px rgba(40,20,30,.6);min-height:1.4em}

.hint{position:absolute;left:50%;bottom:calc(var(--sab) + 160px);transform:translateX(-50%);font-family:var(--f-sans);font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;color:#fffdf9;text-shadow:0 1px 4px rgba(40,20,30,.6);white-space:nowrap;pointer-events:none;opacity:.95;transition:opacity .6s}
.hint.gone{opacity:0}
.near{position:absolute;left:50%;bottom:calc(var(--sab) + 172px);transform:translateX(-50%);padding:10px 18px;white-space:nowrap;font-style:italic;font-size:1.08rem;color:var(--wine);display:flex;gap:8px;align-items:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 112px);transform:translateX(-50%);padding:9px 18px;font-style:italic;font-size:1.06rem;color:var(--ink);white-space:nowrap;animation:drop .5s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-8px)}}

/* sheets: letters list, reading, writing */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(26,16,22,.45);
  padding:calc(var(--sat) + 20px) max(12px,var(--sar)) 0 max(12px,var(--sal));animation:fade .3s ease both}
@keyframes fade{from{opacity:0}}
.paper{position:relative;width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--mount);padding:32px 30px calc(var(--sab) + 28px);
  box-shadow:0 -10px 40px -10px rgba(0,0,0,.5);animation:up .45s var(--ease) both;-webkit-user-select:text;user-select:text}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid var(--edge);pointer-events:none}
.paper h2{font-family:var(--f-serif);font-weight:300;font-size:2rem;line-height:1.05;margin:6px 0 4px}
.paper h2 em{font-style:italic;color:var(--wine)}
.x{position:absolute;top:16px;right:16px;width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:1.6rem;line-height:1;z-index:2}
.list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column}
.list li{border-top:1px solid rgba(184,147,92,.25)}
.list button{width:100%;text-align:left;background:transparent;border:0;padding:14px 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.list .dot{width:8px;height:8px;border-radius:50%;background:transparent;align-self:center}
.list .unread .dot{background:var(--wine)}
.list .meta{font-family:var(--f-sans);font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d)}
.list .pv{grid-column:2;font-style:italic;font-size:1.08rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-style:italic;color:var(--muted);margin:18px 0 0}
.btn{background:transparent;border:1px solid var(--gold);color:var(--gold-d);border-radius:999px;padding:11px 22px;font-family:var(--f-sans);font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;transition:background .3s,color .3s}
.btn:hover{background:var(--gold);color:var(--mount)}
.btn.solid{background:var(--wine);border-color:var(--wine);color:#fdf3e4}
.btn.warn{border-color:var(--wine);color:var(--wine)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.small{font-family:var(--f-sans);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-family:var(--f-sans);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase}
.letter-body{font-style:italic;font-size:1.24rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0 0;color:var(--ink)}
.sig{font-family:var(--f-script);font-size:2.3rem;line-height:1;color:var(--wine);text-align:right;margin:14px 4px 0 0}
textarea{width:100%;min-height:150px;margin-top:16px;border:0;border-bottom:1px solid var(--edge);background:transparent;resize:vertical;font-style:italic;font-size:1.2rem;line-height:1.6;padding:6px 0;outline:none}
textarea:focus{border-color:var(--wine)}
.status{font-family:var(--f-sans);font-size:.6rem;letter-spacing:.14em;color:var(--muted)}

/* entry */
.enter{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(70% 55% at 50% 38%,#3a2131 0%,var(--velvet2) 42%,var(--velvet) 78%,#100a0e 100%);
  padding:calc(var(--sat) + 24px) max(16px,var(--sar)) calc(var(--sab) + 24px) max(16px,var(--sal))}
.card{position:relative;width:100%;max-width:400px;background:var(--mount);padding:40px 34px 34px;text-align:center;box-shadow:0 30px 60px -24px rgba(0,0,0,.7);animation:up .7s var(--ease) both}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--edge);pointer-events:none}
.card::after{content:"";position:absolute;inset:14px;border:.5px solid rgba(184,147,92,.3);pointer-events:none}
.card h1{font-family:var(--f-serif);font-weight:300;font-size:2.8rem;line-height:1;margin:12px 0 8px}
.card h1 em{font-style:italic;background:linear-gradient(105deg,#a67c45 0%,#e8d3a0 30%,#b88b4f 55%,#e2c992 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{font-style:italic;color:var(--ink2);margin:0 0 18px;font-size:1.1rem}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}
.pick button{border:1px solid var(--edge);background:transparent;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .25s,background .25s}
.pick button b{font-weight:400;font-size:1.3rem}
.pick button .sw{width:18px;height:18px;border-radius:3px}
.pick button.on{border-color:var(--wine);background:#fbf0f2}
.word{width:100%;border:0;border-bottom:1px solid var(--edge);background:transparent;text-align:center;font-size:1.25rem;font-style:italic;padding:8px 0;outline:none}
.word:focus{border-color:var(--wine)}
.err{min-height:1.4em;margin:10px 0 0;color:var(--wine);font-style:italic}
.card .btn{margin-top:14px}
.card .sm{margin-top:18px}
@media (max-width:420px){.seg button{padding:8px 13px}.slot{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="no-touch">
  <canvas id="cv" tabindex="0" aria-label="Our home"></canvas>
  <div class="top">
    <div class="chip paperish off" id="chip" aria-live="polite"><i></i><span id="chipText">Opening the door…</span></div>
    <button class="icon-btn paperish" type="button" id="lettersBtn" aria-label="Letters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
      <b class="badge" id="badge" hidden>0</b>
    </button>
  </div>
  <div class="modes seg paperish" role="group" aria-label="Mode"><button type="button" data-mode="walk" class="on" aria-pressed="true">Walk</button><button type="button" data-mode="build" aria-pressed="false">Build</button></div>
  <div class="toast paperish" id="toast" hidden></div>
  <button class="near paperish" type="button" id="nearBtn" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg><span>A letter for you · open it</span></button>
  <div class="hint" id="hint"></div>
  <div id="walkUI">
    <div class="joy" id="joy"><i></i></div>
    <div class="walk-r">
      <button class="round heart kiss" type="button" id="kissBtn" aria-label="Kiss" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.5 12.2c2.1-3.3 4.7-5.2 6.7-5.2 1.2 0 2.1.6 2.8 1.4.7-.8 1.6-1.4 2.8-1.4 2 0 4.6 1.9 6.7 5.2-2.4 3.4-5.6 5.4-9.5 5.4s-7.1-2-9.5-5.4z"/><path d="M4 12.3c2.6.9 5.3 1.3 8 1.3s5.4-.4 8-1.3" fill="none" stroke="var(--mount)" stroke-width="1.1" stroke-linecap="round"/></svg></button>
      <button class="round heart" type="button" id="heartBtn" aria-label="Send hearts"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg></button>
      <button class="round jump" type="button" id="jumpBtn">Jump</button>
    </div>
  </div>
  <div class="build" id="buildUI" hidden>
    <div class="label" id="label" aria-live="polite"></div>
    <div class="build-row"><div class="seg paperish" role="group" aria-label="Tool"><button type="button" data-tool="place" class="on" aria-pressed="true">Place</button><button type="button" data-tool="break" aria-pressed="false">Break</button></div>
      <div class="seg paperish"><button type="button" id="undoBtn" disabled>Undo</button></div></div>
    <div class="bar" id="bar" role="listbox" aria-label="Blocks"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="paper" id="paper" role="dialog" aria-modal="true"></div></div>

<div class="enter" id="enter">
  <form class="card" id="enterForm" autocomplete="off">
    <div class="caps">Baji &amp; Anujin</div>
    <h1>Our <em>home</em></h1>
    <p id="enterLine">Who's coming home?</p>
    <div class="pick" id="pick" role="radiogroup" aria-label="Who are you">
      <button type="button" role="radio" aria-checked="false" data-who="Anujin"><span class="sw" style="background:#a8476b"></span><b>Anujin</b></button>
      <button type="button" role="radio" aria-checked="false" data-who="Baji"><span class="sw" style="background:#41577a"></span><b>Baji</b></button>
    </div>
    <label class="caps" for="word">Our secret word</label>
    <input class="word" id="word" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
    <div class="err" id="err" aria-live="polite"></div>
    <button class="btn solid" type="submit" id="go">Come in</button>
    <div class="small sm">Tip: add this page to your home screen</div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
