<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one full-screen book. Every part of the story is a page; pages turn on a spine at the left. A sealed envelope and letter open it. */
:root{
  --bg:#fbf8fb; --surface:#ffffff; --ink:#2a1f30; --muted:#8c7f96; --line:#ece2ef;
  --accent:#8e4fa8; --accent2:#d9829f; --gold:#c4a57a; --accent-ink:#ffffff; --soft:#f4ecf6;
  --orb1:#efc6dc; --orb2:#d9c4f0;
  --grad:linear-gradient(135deg,var(--accent2),var(--accent));
  --shadow:0 1px 1px rgba(60,25,80,.04),0 18px 50px -14px rgba(60,25,80,.22);
  --shade:rgba(40,12,55,.22); --scrim:rgba(22,12,28,.92);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Jost","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:72px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141016; --surface:#1d1720; --ink:#f1e9f3; --muted:#a395ad; --line:#2f2734;
  --accent:#c48ad6; --accent2:#eea3c2; --gold:#d6b98c; --accent-ink:#220f2a; --soft:#251e29;
  --orb1:#4a2440; --orb2:#33264f;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 20px 50px -14px rgba(0,0,0,.6); --shade:rgba(0,0,0,.45); color-scheme:dark}}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:300 17px/1.6 var(--f-body);-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent2);color:var(--accent-ink)}
button,input{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
img{max-width:100%}
[hidden]{display:none!important}
.eyebrow{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.hair{width:56px;height:1px;background:var(--gold);border:0;margin:0}

/* ambient */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.orb.a{width:46vmax;height:46vmax;background:var(--orb1);top:-18vmax;right:-14vmax;animation:drift1 26s ease-in-out infinite alternate}
.orb.b{width:40vmax;height:40vmax;background:var(--orb2);bottom:-20vmax;left:-16vmax;animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-8vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(10vmax,-8vmax) scale(1.08)}}

/* ========== the deck ========== */
.deck{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:max(18px,calc(env(safe-area-inset-top,0px) + 12px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.book{position:relative;width:min(1120px,100%);height:min(100%,760px);perspective:2400px;isolation:isolate;outline:none}
.book::before,.book::after{content:"";position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 4px;z-index:-1}
.book::before{transform:translate(5px,5px)}
.book::after{transform:translate(10px,10px);opacity:.7}
.side{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer;z-index:6;transition:border-color .3s,color .3s,opacity .3s}
.side:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.side:disabled{opacity:0;pointer-events:none}
.side.l{left:-76px}.side.r{right:-76px}
@media (max-width:1300px){.side{display:none}}

.nav{height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:min(1120px,100%);margin:0 auto}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.05rem;cursor:pointer;transition:border-color .3s,color .3s}
.navbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.navbtn:disabled{opacity:.3;cursor:default}
.mid{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.prog{width:min(420px,100%);height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.where{display:flex;gap:10px;align-items:center;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%}
.where b{font-weight:500;color:var(--ink)}
.auto{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.auto.on{color:var(--accent);border-color:var(--accent)}
.auto:hover{color:var(--accent)}

/* leaves (pages) */
.leaf{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 4px;box-shadow:var(--shadow);overflow:hidden;transform-style:preserve-3d}
.leaf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:28px;background:linear-gradient(90deg,var(--shade),transparent);opacity:.5;z-index:3;pointer-events:none}
.leaf.leaving,.leaf.leaving-top{z-index:5;transform-origin:left center;backface-visibility:hidden}
.leaf.leaving{animation:turnOut .95s cubic-bezier(.6,.04,.3,1) forwards}
.leaf.leaving-top{animation:turnIn .95s cubic-bezier(.6,.04,.3,1) both}
.leaf.leaving::after,.leaf.leaving-top::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,var(--shade));z-index:6;pointer-events:none}
.leaf.leaving::after{animation:shadeIn .95s forwards}
.leaf.leaving-top::after{animation:shadeOut .95s forwards}
@keyframes turnOut{0%{transform:rotateY(0)}75%{opacity:1}100%{transform:rotateY(-112deg);opacity:0}}
@keyframes turnIn{0%{transform:rotateY(-112deg);opacity:0}25%{opacity:1}100%{transform:rotateY(0);opacity:1}}
@keyframes shadeIn{from{opacity:0}to{opacity:1}}
@keyframes shadeOut{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes kb{from{transform:scale(1.09)}to{transform:scale(1)}}
.fresh .rv{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.35s + var(--d,0) * .13s)}
.fresh .kb{animation:kb 8s cubic-bezier(.2,.6,.2,1) both}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

.pg-num{position:absolute;right:22px;bottom:16px;font-family:var(--f-display);font-style:italic;font-size:.85rem;color:var(--gold);z-index:4;font-variant-numeric:tabular-nums}
.dark .pg-num{color:#d6b98c}

/* title page */
.t-page{display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px;padding:0 clamp(28px,7vw,90px)}
.t-page h1{font-family:var(--f-display);font-weight:300;font-size:clamp(3rem,8vw,6rem);line-height:.98;margin:16px 0 22px;letter-spacing:-.02em}
.t-page h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.t-page .tag{color:var(--muted);margin:16px 0 0;max-width:40ch;font-size:1.05rem}
.t-page .meta{font-size:.8rem;color:var(--muted);margin-top:18px;letter-spacing:.02em}
.ring{position:relative;width:clamp(170px,22vw,240px);aspect-ratio:1;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{fill:none;stroke:var(--line);stroke-width:1.5}
.ring .prog2{fill:none;stroke:url(#ringGrad);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 2.4s cubic-bezier(.65,0,.25,1) .5s}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-in .big{font-family:var(--f-display);font-weight:300;font-size:clamp(3.2rem,5.4vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring-in .of{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ring-in .sub{font-family:var(--f-display);font-style:italic;font-size:.95rem;color:var(--accent);margin-top:8px}
.t-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:breathe 2.6s ease-in-out infinite;white-space:nowrap}
@keyframes breathe{50%{opacity:.4}}

/* letter page */
.l-page{display:flex;align-items:center;justify-content:center;padding:28px}
.paper{width:100%;max-width:560px;background:#fffdfb;color:#2a1f30;border-radius:4px;padding:44px 40px 36px;text-align:left;position:relative}
.paper::before{content:"";position:absolute;inset:12px;border:1px solid rgba(196,165,122,.45);border-radius:2px;pointer-events:none}
.paper .to{font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:#a88a5f;margin:0 0 18px}
.paper .ln{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(1.12rem,2.6vw,1.4rem);line-height:1.6;margin:0 0 4px}
.paper .ln.first{font-size:clamp(1.5rem,3.4vw,1.8rem);margin-bottom:12px}
.paper .sig{font-family:var(--f-display);font-style:italic;font-size:1.3rem;margin:22px 0 0;text-align:right;color:#8e4fa8}
.l-page .paper{box-shadow:0 1px 0 var(--line),0 20px 50px -24px rgba(60,25,80,.35)}
.fresh .paper .ln,.fresh .paper .sig{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.45s + var(--i) * .38s)}

/* chapter page */
.c-page{display:grid;grid-template-columns:1.12fr 1fr}
.c-photo{position:relative;background:var(--soft);overflow:hidden;min-height:0}
.c-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c-text{padding:clamp(28px,5vw,60px) clamp(24px,4vw,52px) 48px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0;min-height:0}
.c-text .when{font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.c-page.day1 .when{color:var(--accent)}
.c-text h3{font-family:var(--f-display);font-weight:300;font-size:clamp(1.9rem,3.8vw,2.8rem);line-height:1.1;margin:6px 0 10px;letter-spacing:-.01em;text-wrap:balance}
.rule{width:36px;height:1px;background:var(--gold);margin:0 0 8px}
.c-text p{font-size:clamp(1rem,1.5vw,1.12rem);line-height:1.8;margin:0;max-width:40ch}
.c-num{font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:clamp(3.4rem,7vw,5.6rem);line-height:.8;font-weight:300;opacity:.35;position:absolute;right:26px;top:22px;z-index:2;font-variant-numeric:tabular-nums}
.day1-badge{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;margin-top:16px;padding:5px 12px;border-radius:999px;background:var(--grad);color:var(--accent-ink);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase}

/* someday page */
.s-page{display:flex;align-items:center;justify-content:center;background:radial-gradient(130% 80% at 50% 120%,#7a3c6c 0%,#3a2340 38%,#1d1422 70%,#140f18 100%);color:#f3eaf6;border-color:transparent}
.s-glow{position:absolute;left:50%;bottom:-38%;width:120%;aspect-ratio:2;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(240,170,190,.45),rgba(214,185,140,.12) 55%,transparent);animation:dawn 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes dawn{from{opacity:.55;transform:translate(-50%,6%)}to{opacity:1;transform:translate(-50%,0)}}
.starfield{position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(1px 1px at 14% 16%,#fff,transparent),radial-gradient(1px 1px at 78% 10%,#fff,transparent),radial-gradient(1.4px 1.4px at 88% 34%,#f6e4ff,transparent),radial-gradient(1px 1px at 30% 30%,#fff,transparent),radial-gradient(1px 1px at 62% 22%,#ffe9c9,transparent),radial-gradient(1px 1px at 8% 44%,#fff,transparent),radial-gradient(1px 1px at 46% 8%,#fff,transparent),radial-gradient(1.2px 1.2px at 92% 70%,#fff,transparent),radial-gradient(1px 1px at 20% 84%,#fff,transparent)}
.s-in{position:relative;z-index:1;text-align:center;max-width:640px;padding:40px 28px}
.s-in .when{font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:#d6b98c}
.s-in h3{font-family:var(--f-display);font-weight:300;font-size:clamp(2rem,4.4vw,3rem);margin:10px 0 12px;color:#f6eef8}
.s-in .rule{margin:0 auto 14px}
.s-in .hard{color:#d9cbe2;max-width:44ch;margin:0 auto;font-size:clamp(1rem,1.6vw,1.12rem);line-height:1.8}
.s-in .soon{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.4;margin:26px auto 0;max-width:28ch;background:linear-gradient(135deg,#f6c2d6,#e3b98f);-webkit-background-clip:text;background-clip:text;color:transparent}
.fresh .s-in .soon{animation-duration:1.4s}

/* sky page */
.sky-page{background:radial-gradient(80% 70% at 50% 45%,#161430 0%,#0a0b10 72%);color:#e9e3ef;border-color:transparent;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(24px,5vw,70px);padding:0 clamp(28px,6vw,80px)}
.sky-disc{position:relative;height:min(84%,600px);aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 0 0 1px rgba(214,185,140,.35),0 0 0 12px rgba(255,255,255,.012),0 0 0 13px rgba(214,185,140,.14),0 50px 140px -30px rgba(130,90,190,.55)}
.sky-rot{position:absolute;inset:0;border-radius:50%;overflow:hidden;animation:skyturn 1200s linear infinite}
.sky-rot img,.sky-rot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@keyframes skyturn{to{transform:rotate(360deg)}}
.fresh .sky-disc{animation:skyIn 1.6s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes skyIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.sky-txt{display:flex;flex-direction:column;gap:18px;min-width:0}
.sky-txt .eyebrow{color:#d6b98c}
.sky-txt h3{font-family:var(--f-display);font-weight:300;font-size:clamp(2rem,4.2vw,3.2rem);line-height:1.08;margin:0;color:#f3ecf6}
.sky-cap{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:#a9a0b8;line-height:2.2;margin:0}
.sky-cap span{color:#d9829f}
.sky-note{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:1.15rem;color:#cdc1d8;max-width:30ch;margin:0}

/* hundred page */
.h-page{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:clamp(24px,5vw,64px);padding:0 clamp(28px,6vw,80px)}
.h-page h3,.b-page h3,.f-page h3{font-family:var(--f-display);font-weight:300;font-size:clamp(2rem,4.2vw,3.2rem);line-height:1.08;margin:10px 0 14px;letter-spacing:-.01em}
.h-page p.cap{font-family:var(--f-display);font-style:italic;color:var(--muted);margin:0;max-width:32ch;font-size:1.05rem}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(6px,1vw,11px);width:100%;max-width:440px;justify-self:center}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0;cursor:default;position:relative;transition:transform .3s}
.fresh .dot{animation:pop .6s cubic-bezier(.2,.8,.2,1.2) both;animation-delay:calc(var(--i) * 12ms + .4s)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.dot.past{background:var(--soft);border-color:var(--soft)}
.dot.has{background:var(--grad);border-color:transparent;cursor:pointer;box-shadow:0 2px 8px -2px var(--accent2)}
.dot.has:hover{transform:scale(1.25)}
.dot.today{border-color:var(--accent)}
.dot.today::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--accent);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--line)}

/* between page */
.b-page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 clamp(24px,5vw,70px);gap:8px}
.between{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:20px;width:100%;max-width:860px;margin-top:20px}
.city .time{font-family:var(--f-display);font-weight:300;font-size:clamp(2.4rem,5.4vw,3.8rem);line-height:1;font-variant-numeric:tabular-nums}
.city .name{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.city .part{font-family:var(--f-display);font-style:italic;color:var(--accent);margin-top:4px}
.arc svg{width:100%;height:auto;display:block;overflow:visible}
.arc .path{fill:none;stroke:var(--gold);stroke-width:1.2;stroke-dasharray:3 6}
.arc .pin{fill:var(--accent)}
.arc .hrt{fill:var(--accent2)}
.b-foot{margin:30px 0 0;color:var(--muted);font-size:.95rem}
.b-foot b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:1.2rem}

/* album */
.a-cover{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--grad);color:var(--accent-ink);border-color:transparent}
.a-cover::before{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.frame{position:absolute;inset:22px;border:1px solid rgba(255,255,255,.45);border-radius:2px 10px 10px 2px;pointer-events:none}
.a-cover .in{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px}
.a-cover .eyebrow{color:inherit;opacity:.85}
.a-cover h3{font-family:var(--f-display);font-weight:300;font-style:italic;font-size:clamp(2.8rem,7vw,4.6rem);line-height:1;margin:0}
.a-cover p{margin:0;opacity:.9}
.ghost-btn{margin-top:10px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;padding:10px 24px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s}
.a-cover .ghost-btn:hover{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.a-page{padding:22px 22px 22px 36px}
.spread{display:grid;gap:16px;height:100%}
.spread.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.spread.l3{grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr}
.spread.l3 .shot:first-child{grid-row:1/3}
.spread.l2{grid-template-columns:1fr 1fr}
.spread.l1{grid-template-columns:1fr}
.shot{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.shot-img{flex:1;min-height:0;padding:0;border:0;background:var(--soft);overflow:hidden;cursor:zoom-in;display:block;width:100%;border-radius:2px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .4s,transform .5s cubic-bezier(.2,.7,.2,1)}
.shot-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}

(function(){
  const DATA={"info": {"startDate": "2026-07-25", "names": ""}, "story": [{"order": 100, "photo": "1a662dd179db4537ffad20280f0883c4", "text": "Shortly after, sadly, I had to go back to Australia.", "title": "Back to Australia", "when": "Shortly after", "id": "ch-back-to-aus"}, {"order": 10, "photo": "786afe66a125f8f07f0110e05d9dfebe", "text": "The very first thing. She drunk called me, and she was so embarrassed about it. I told her, \"You owe me a drunk call.\" That's how it all started.", "title": "The drunk call", "when": "1 Nov 2025", "id": "ch-first-call"}, {"order": 60, "photo": "c00b6fa4d997cb28859db4ebbfc10bab", "text": "Then we went on a proper date. Dinner at World Wine, then Bitsy, then Broski, then Fat Cat. We grabbed snacks from a convenience store on the way and spent the night at our place.", "title": "Our first date", "when": "Summer 2026", "id": "ch-first-date"}, {"order": 30, "photo": "9940af01768bbc713c160c967dd91d0a", "text": "I came to Mongolia and we finally hung out. We first met in front of the Vault, Mongol Bank. She was wearing a white fur-ish top, blue jeans and a white net top.", "title": "Meeting in Mongolia", "when": "26 Jun 2026", "id": "ch-first-meet"}, {"order": 70, "photo": "d24ac62eeb4a849b19b6572b1db0ed01", "text": "After that we hung out even more, and she met all my friends.", "title": "Meeting the friends", "when": "Summer 2026", "id": "ch-friends"}, {"order": 40, "photo": "d486ec9f3169a298aff9e29ada29b74e", "text": "After that we started hanging out often. She would come over and we'd just hang out.", "title": "Hanging out all the time", "when": "Summer 2026", "id": "ch-hanging-out"}, {"order": 110, "photo": "9aac61c5c0b4706cd5f23a37f6e4034d", "text": "We've been doing long distance. Phone calls all the time, me sending her dinner and flowers, and watching cute movies together.", "title": "Long distance, still us", "when": "Aug – Oct 2026", "id": "ch-long-distance"}, {"order": 20, "photo": "8a5411e3940c2ffe81c37db952cabdb6", "   const $=id=>document.getElementById(id);

  const LETTER=["Hey bby,","bi chmg zunduu sanaj bno, ur the best,","i miss u a lot,","idk seeing u happy makes me happy,","i like making you happy its fun,","i love you so much,","comeover here, and then lets alaltsah with life together"];

  const S=[];

      return `<article class="leaf h-page"><div><div class="eyebrow rv" style="--d:0">Since 25 July</div><h3 class="rv" style="--d:1">The hundred</h3>

  // ---------- page turning ----------
  let cur=0, busy=false;
  function swap(html,dir){
    const box=$("book"), tpl=document.createElement("template"); tpl.innerHTML=html.trim(); const el=tpl.content.firstElementChild;
    const old=box._cur; [...box.children].forEach(n=>{if(n!==old)n.remove()}); if(old) old.classList.remove("leaving-top");
    box._cur=el; if(!reduce()) el.classList.add("fresh");
    if(!old||!dir||reduce()){box.replaceChildren(el);return el}
    if(dir==="next"){old.classList.add("leaving");box.insertBefore(el,old);old.addEventListener("animationend",e=>{if(e.target===old)old.remove()})}
    else{el.classList.add("leaving-top");box.appendChild(el);el.addEventListener("animationend",e=>{if(e.target===el){el.classList.remove("leaving-top");old.remove()}})}
    return el;
  }
  let stopFx=[];
  function show(i,dir){
    i=Math.max(0,Math.min(S.length-1,i)); const s=S[i]; cur=i;
    stopFx.forEach(f=>f()); stopFx=[];
    const el=swap(R[s.t](s),dir);
    wire(el,s);
    $("prev").disabled=i===0; $("next").disabled=i===S.length-1;
    $("progBar").style.width=((i+1)/S.length*100)+"%";
    $("whereLbl").textContent=s.lbl;
    $("whereNum").textContent=`${i+1} / ${S.length}`;
    try{sessionStorage.setItem("page",i)}catch(_){}
  }
  function go(d){ if(cur+d<0||cur+d>=S.length) return; show(cur+d,d>0?"next":"prev") }
  function jump(i){ if(i===cur) return; show(i,i>cur?"next":"prev") }

  // per-page life
  function wire(el,s){
    el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openLb(b.dataset.open));
    el.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>jump(pageOfPhoto(b.dataset.photo)));
    el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act; if(a==="start"){jump(0)} else if(a==="slideshow"){stopAuto();startShow(0)}});
    if(s.t==="title"){const big=el.querySelector(".big"),n=+big.dataset.count,ring=el.querySelector(".prog2");

      requestAnimationFrame(()=>requestAnimationFrame(()=>{ring.style.strokeDashoffset=RING*(1-frac)}));
      const t0=performance.now()+500,dur=2400;let raf;(function tick(t){const p=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-p,3);big.textContent=Math.round(n*e);if(p<1)raf=requestAnimationFrame(tick)})(performance.now());

    if(s.t==="sky") stopFx.push(twinkle(el.querySelector(".twk")));

    if(s.t==="finale") stopFx.push(confetti(el.querySelector(".confetti")));
    if(s.t==="album"||s.t==="chapter"){const nx=S[cur+1];if(nx){const tmp=document.createElement("div");tmp.innerHTML=R[nx.t](nx);tmp.querySelectorAll("img").forEach(im=>{const p=new Image();p.src=im.src})}}
  }

  // clocks
  const tf=tz=>new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false});
  const hf=tz=>new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"numeric",hour12:false});
  const partOf=h=>h<5?"asleep, probably":h<12?"morning":h<17?"afternoon":h<21?"evening":"night";
  function clocks(){const n=new Date();document.querySelectorAll("[data-tz]").forEach(e=>e.textContent=tf(e.dataset.tz).format(n));
    document.querySelectorAll("[data-part]").forEach(e=>e.textContent=partOf(+hf(e.dataset.part).format(n)%24))}
  setInterval(clocks,15000);

  // twinkling stars
  function twinkle(cv){ if(!cv||reduce()) return ()=>{}; const ctx=cv.getContext("2d"); let W=0,pts=[],raf;
    function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;cv.width=W*d;cv.height=W*d;ctx.setTransform(d,0,0,d,0,0);
      pts=Array.from({length:46},()=>{let x,y;do{x=Math.random();y=Math.random()}while((x-.5)**2+(y-.5)**2>.2);return{x,y,s:Math.random()*1.3+.4,p:Math.random()*6.28,v:.6+Math.random()*1.4}})}
    function draw(t){raf=requestAnimationFrame(draw);if(!W){size();return}ctx.clearRect(0,0,W,W);
      for(const q of pts){const a=Math.max(0,Math.sin(q.p+t/1000*q.v));if(a<.05)continue;ctx.globalAlpha=a*.9;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(q.x*W,q.y*W,q.s,0,6.283);ctx.fill();
        if(q.s>1.2){ctx.globalAlpha=a*.35;ctx.fillRect(q.x*W-q.s*3,q.y*W-.4,q.s*6,.8);ctx.fillRect(q.x*W-.4,q.y*W-q.s*3,.8,q.s*6)}}}
    setTimeout(size,60); raf=requestAnimationFrame(draw); return ()=>cancelAnimationFrame(raf)}

  // soft confetti hearts on the last page
  function confetti(cv){ if(!cv||reduce()) return ()=>{}; const ctx=cv.getContext("2d"); let W,H,raf,ps=[];
    function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
    const cols=["#d9829f","#c48ad6","#e3b98f","#f0b8cf","#8e4fa8"];
    function seed(){size();ps=[];for(let i=0;i<70;i++) ps.push({x:Math.random()*W,y:-20-Math.random()*H*.8,vy:.5+Math.random()*1.1,vx:(Math.random()-.5)*.5,r:4+Math.random()*6,a:Math.random()*6.28,va:(Math.random()-.5)*.04,c:cols[i%cols.length]})}
    function heart(x,y,r,a,c){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,r*.3);ctx.bezierCurveTo(-r,-r*.5,-r*.5,-r*1.2,0,-r*.5);ctx.bezierCurveTo(r*.5,-r*1.2,r,-r*.5,0,r*.3);ctx.fill();ctx.restore()}
    let t0=0;
    function draw(t){if(!t0)t0=t;raf=requestAnimationFrame(draw);ctx.clearRect(0,0,W,H);const fade=Math.max(0,1-(t-t0-6000)/2500);if(fade<=0){cancelAnimationFrame(raf);return}
      ctx.globalAlpha=.85*fade;for(const p of ps){p.y+=p.vy;p.x+=p.vx+Math.sin((t/900)+p.r)*.3;p.a+=p.va;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}heart(p.x,p.y,p.r,p.a,p.c)}}
    setTimeout(()=>{seed();raf=requestAnimationFrame(draw)},1000); return ()=>cancelAnimationFrame(raf)}

  // ---------- autoplay through the whole book ----------
  let auto=null;
  function startAuto(){ $("autoBtn").classList.add("on"); $("autoBtn").textContent="❚❚ Pause"; clearInterval(auto);
    auto=setInterval(()=>{ if(cur>=S.length-1){stopAuto();return} go(1) }, 6500) }
  function stopAuto(){ clearInterval(auto); auto=null; $("autoBtn").classList.remove("on"); $("autoBtn").textContent="▶ Play" }
  $("autoBtn").onclick=()=>{ auto?stopAuto():(go(1),startAuto()) };

  // ---------- input ----------
  $("prev").onclick=()=>{stopAuto();go(-1)}; $("next").onclick=()=>{stopAuto();go(1)};
  document.addEventListener("keydown",e=>{
    if(!$("sealScreen").classList.contains("gone")) return;
    if(!$("lb").hidden){ if(e.key==="Escape")closeLb(); else if(e.key==="ArrowRight"){stopShow();lbStep(1)} else if(e.key==="ArrowLeft"){stopShow();lbStep(-1)} else if(e.key===" "){e.preventDefault();show_?stopShow():startShow()} return }
    if(e.key==="ArrowRight"||e.key==="PageDown"||(e.key===" "&&!e.target.closest("button"))){e.preventDefault();stopAuto();go(1)}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();stopAuto();go(-1)}
    else if(e.key==="Home"){stopAuto();jump(0)} else if(e.key==="End"){stopAuto();jump(S.length-1)}
  });
  (function(){let x0=null,y0=null;const st=$("deck");
    st.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
    st.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){stopAuto();go(dx<0?1:-1)}})})();
  // wheel / trackpad turns pages too
  (function(){let lock=0;$("deck").addEventListener("wheel",e=>{if(e.target.closest(".scroll,.c-text"))return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<24)return;const now=Date.now();if(now<lock)return;lock=now+900;stopAuto();go(d>0?1:-1)},{passive:true})})();

  // ---------- lightbox + photo slideshow ----------
  let lbId=null, show_=null;
  function openLb(id){const m=photos.find(x=>x.id===id);if(!m)return;lbId=id;stopAuto();
    const img=$("lbImg");img.classList.remove("show");void img.offsetWidth;img.src="photos/"+m.photo+".jpg";img.alt="Photo from "+fmt(m.date);img.classList.add("show");
    const d=dayOf(m.date),i=photos.indexOf(m);$("lbMeta").textContent=(d>=1&&d<=100?"Day "+d+" · ":"")+fmt(m.date)+"   ·   "+(i+1)+" of "+photos.length;
    $("lbPrev").disabled=i<=0;$("lbNext").disabled=i>=photos.length-1;
    const nx=photos[i+1];if(nx){const p=new Image();p.src="photos/"+nx.photo+".jpg"}
    if($("lb").hidden){$("lb").hidden=false;$("lbX").focus();if(!show_)$("lbPlay").textContent="Play"}}
  function closeLb(){stopShow();if($("lb").hidden)return;$("lb").hidden=true;const k=pageOfPhoto(lbId);lbId=null;if(k>=0&&k!==cur)jump(k)}
  function lbStep(d){const i=photos.findIndex(x=>x.id===lbId),j=i+d;if(j>=0&&j<photos.length)openLb(photos[j].id)}
  function tickBar(){const b=$("lbBar");b.classList.remove("run");void b.offsetWidth;b.classList.add("run")}
  function startShow(from){if(!photos.length)return;if($("lb").hidden)openLb(photos[from||0].id);clearInterval(show_);
    show_=setInterval(()=>{const i=photos.findIndex(x=>x.id===lbId);openLb(photos[(i+1)%photos.length].id);tickBar()},4000);$("lbPlay").textContent="Pause";tickBar()}
  function stopShow(){if(show_){clearInterval(show_);show_=null}$("lbPlay").textContent="Play";$("lbBar").classList.remove("run")}
  $("lbPlay").onclick=()=>{show_?stopShow():startShow()};
  $("lbX").onclick=closeLb; $("lbPrev").onclick=()=>{stopShow();lbStep(-1)}; $("lbNext").onclick=()=>{stopShow();lbStep(1)};
  $("lb").addEventListener("click",e=>{if(e.target===$("lb")||e.target.classList.contains("lb-in"))closeLb()});
  (function(){let x0=null;$("lb").addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});$("lb").addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45){stopShow();lbStep(dx<0?1:-1)}})})();

  // ---------- envelope + letter ----------
  const sc=$("sealScreen");
  $("sealLetter").innerHTML=letterHTML(); $("toBook").style.setProperty("--n",LETTER.length);
  let opened=false, startAt=0; try{opened=sessionStorage.getItem("opened")==="1";startAt=+sessionStorage.getItem("page")||0}catch(_){}
  if(opened){sc.classList.add("gone");show(startAt,null);$("book").focus({preventScroll:true})}
  else{
    $("sealBtn").onclick=()=>{sc.classList.add("opening");try{sessionStorage.setItem("opened","1")}catch(_){}
      if(reduce()){sc.classList.add("letter");return} setTimeout(popOut,1500)};
    function popOut(){const card=$("envCard"),paper=$("sealLetter");const r1=card.getBoundingClientRect();sc.classList.add("letter");const r2=paper.getBoundingClientRect();
      paper.style.transition="none";paper.style.transformOrigin="0 0";paper.style.transform=`translate(${r1.left-r2.left}px,${r1.top-r2.top}px) scale(${r1.width/r2.width},${r1.height/r2.height})`;
      card.style.visibility="hidden";requestAnimationFrame(()=>requestAnimationFrame(()=>{paper.style.transition="transform 1.1s cubic-bezier(.3,.8,.2,1)";paper.style.transform="none";setTimeout(()=>$("toBook").focus({preventScroll:true}),1200)}))}
    $("toBook").onclick=()=>{$("letterWrap").classList.add("away");
      setTimeout(()=>{sc.classList.add("done");show(0,"next");setTimeout(()=>{sc.classList.add("gone");$("book").focus({preventScroll:true})},reduce()?50:1000)},reduce()?0:550)};
    $("sealBtn").focus();
  }
})();
</script>
</body>
</html>
